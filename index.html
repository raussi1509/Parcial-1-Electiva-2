<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Despliegue Continuo</title>
  <style>
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background-color: #f8fafc;
      color: #0f172a;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
    }
    .card {
      background: #ffffff;
      padding: 2.5rem;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
      text-align: center;
      max-width: 420px;
      border: 1px solid #e2e8f0;
    }
    .badge {
      background: #e0e7ff;
      color: #4338ca;
      font-size: 0.85rem;
      font-weight: 600;
      padding: 0.35rem 0.85rem;
      border-radius: 20px;
      display: inline-block;
      margin-bottom: 1rem;
    }
    h1 {
      font-size: 1.6rem;
      margin: 0 0 0.75rem 0;
    }
    p {
      color: #64748b;
      font-size: 0.95rem;
      line-height: 1.5;
      margin: 0;
    }
  </style>
</head>
<body>
  <div class="card">
    <span class="badge">CI/CD Activo</span>
    <h1>¡Despliegue Exitoso!</h1>
    <p>Esta página se publica automáticamente en Surge.sh a través de GitHub Actions con cada <code>git push</code>.</p>
  </div>
</body>
</html>
